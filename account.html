<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Crispy</title>
<meta name="description" content="Manage your Crispy account.">
<link rel="icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/crispy-pizza.css">

<style>
.cp-logo, .cp-logo:visited, .cp-logo:hover, .cp-logo:active{ color:#fff !important; text-decoration:none !important; }
.cp-logo img.cp-logo__mark{ background:transparent !important; }
.cp-acct-wrap{
  position:relative; z-index:1;
  max-width:760px; margin:0 auto;
  padding:clamp(2.5rem, 7vw, 4rem) clamp(1.2rem,4vw,2rem) 6rem;
}
.cp-acct-header{
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; margin-bottom:2.2rem; flex-wrap:wrap;
}
.cp-acct-eyebrow{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--cp-text-faint); margin-bottom:.5rem; }
.cp-acct-title{ font-family:var(--font-display); font-size:clamp(1.7rem,3.6vw,2.4rem); font-weight:600; }
.cp-section-box{
  border:1px solid var(--cp-border);
  border-radius:0;
  background:var(--cp-surface);
  padding:1.6rem;
  margin-bottom:1.2rem;
}
.cp-section-box h3{ font-size:.95rem; font-weight:600; margin-bottom:.3rem; }
.cp-section-box p{ color:var(--cp-text-dim); font-size:.9rem; }
.cp-username-row{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-top:.9rem; }
.cp-username-row input{
  flex:1; min-width:180px; padding:.7rem 1rem;
  border-radius:0; border:1px solid var(--cp-border);
  background:var(--cp-surface); color:var(--cp-text);
  font-size:.95rem; font-family:inherit;
}
.cp-username-row input:focus{ outline:2px solid var(--cp-orange); outline-offset:1px; }
.cp-username-msg{ min-height:1.2em; margin-top:.6rem; font-size:.85rem; color:var(--cp-text-faint); }
.cp-field-label{ display:block; font-size:.78rem; color:var(--cp-text-faint); margin-bottom:.35rem; }
.cp-field-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1.1rem;
}
@media (max-width:560px){ .cp-field-grid{ grid-template-columns:1fr; } }
.cp-field-grid input, .cp-profile-avatar-row input{
  width:100%; padding:.7rem 1rem;
  border-radius:0; border:1px solid var(--cp-border);
  background:var(--cp-surface); color:var(--cp-text);
  font-size:.9rem; font-family:inherit;
}
.cp-field-grid input:focus, .cp-profile-avatar-row input:focus{ outline:2px solid var(--cp-orange); outline-offset:1px; }
.cp-profile-avatar-row{ display:flex; align-items:center; gap:1rem; margin-top:.9rem; flex-wrap:wrap; }
.cp-avatar-preview{
  width:56px; height:56px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--cp-orange); color:#1a0800; font-weight:700; font-size:1.2rem;
  overflow:hidden;
}
.cp-avatar-preview img{ width:100%; height:100%; object-fit:cover; }
.cp-avatar-drop{
  border:1px dashed var(--cp-border); background:var(--cp-surface);
  padding:1rem; text-align:center; cursor:pointer;
  color:var(--cp-text-faint); font-size:.82rem; transition:all .2s var(--ease);
}
.cp-avatar-drop:hover, .cp-avatar-drop.is-dragover{ border-color:var(--cp-orange); color:var(--cp-text); }
</style>
</head>
<body class="cp-body">

<div class="cp-starfield" aria-hidden="true"></div>

<header class="cp-topbar">
  <a href="index.html" class="cp-logo" style="color:#fff;">
    <img src="assets/icon.png" alt="Crispy" class="cp-logo__mark" style="width:24px;height:24px;object-fit:contain;">
    Crispy
  </a>
  <div class="cp-topbar__right">
  </div>
</header>

<main>
  <div class="cp-acct-wrap" id="acctContent">
    <p style="color:var(--cp-text-faint);">Loading…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  const content = document.getElementById('acctContent');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (m) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
    ));
  }

  async function load() {
    const user = await DCAuth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const profile = await DCAuth.getProfile();
    const currentUsername = (profile && profile.username) ? profile.username : '';
    const fullName    = (profile && profile.full_name) ? profile.full_name : '';
    const phone       = (profile && profile.phone) ? profile.phone : '';
    const backupEmail = (profile && profile.backup_email) ? profile.backup_email : '';
    const dob         = (profile && profile.date_of_birth) ? profile.date_of_birth : '';
    const avatarUrl   = (profile && profile.avatar_url) ? profile.avatar_url : '';
    const heading = currentUsername || user.email;
    const initial = (heading || '?').trim().charAt(0).toUpperCase();

    content.innerHTML = `
      <div class="cp-acct-header">
        <div>
          <div class="cp-acct-eyebrow">Crispy account</div>
          <h1 class="cp-acct-title">${esc(heading)}</h1>
        </div>
        <button class="cp-btn cp-btn--ghost-cp cp-btn--sm" id="logoutBtn" style="width:auto;">Log out</button>
      </div>

      <div class="cp-section-box">
        <h3>Username</h3>
        <p>This is how you'll show up around Crispy and Darkness. 3–20 characters, letters, numbers and underscores. Must be unique.</p>
        <div class="cp-username-row">
          <input type="text" id="usernameInput" placeholder="Choose a username"
            value="${esc(currentUsername)}" autocomplete="off" spellcheck="false">
          <button class="cp-btn cp-btn--sm" id="saveUsernameBtn" style="width:auto;">Save</button>
        </div>
        <p class="cp-username-msg" id="usernameMsg"></p>
      </div>

      <div class="cp-section-box">
        <h3>Personal info</h3>
        <p>Your name, birthday, and how we reach you if we ever need to.</p>

        <div class="cp-profile-avatar-row">
          <span class="cp-avatar-preview" id="avatarPreview">${avatarUrl ? `<img src="${esc(avatarUrl)}" alt="">` : esc(initial)}</span>
          <div style="flex:1;min-width:200px;">
            <label class="cp-field-label">Profile picture</label>
            <div class="cp-avatar-drop" id="avatarDrop">
              <input type="file" id="avatarFile" accept="image/*" hidden>
              <span id="avatarDropText">Drag &amp; drop an image, or click to choose one</span>
            </div>
            <p class="cp-username-msg" id="avatarMsg"></p>
          </div>
        </div>
        <input type="hidden" id="avatarUrlValue" value="${esc(avatarUrl)}">

        <div class="cp-field-grid">
          <div>
            <label class="cp-field-label" for="fullNameInput">Full name</label>
            <input type="text" id="fullNameInput" placeholder="Your full name" value="${esc(fullName)}" autocomplete="name">
          </div>
          <div>
            <label class="cp-field-label" for="dobInput">Date of birth</label>
            <input type="date" id="dobInput" value="${esc(dob)}">
          </div>
          <div>
            <label class="cp-field-label" for="phoneInput">Phone number</label>
            <input type="tel" id="phoneInput" placeholder="+1 555 000 0000" value="${esc(phone)}" autocomplete="tel">
          </div>
          <div>
            <label class="cp-field-label" for="backupEmailInput">Backup email</label>
            <input type="email" id="backupEmailInput" placeholder="backup@example.com" value="${esc(backupEmail)}" autocomplete="email">
          </div>
        </div>

        <div style="margin-top:1.1rem;">
          <button class="cp-btn cp-btn--sm" id="saveProfileBtn" style="width:auto;">Save changes</button>
        </div>
        <p class="cp-username-msg" id="profileMsg"></p>
      </div>

      <div class="cp-section-box">
        <h3>My files</h3>
        <p>Everything you've bought on Crispy, with instant downloads.</p>
        <div style="margin-top:1.1rem;">
          <a class="cp-btn cp-btn--sm" href="purchases.html" style="width:auto;display:inline-block;">View my files</a>
        </div>
      </div>
    `;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await DCAuth.signOut();
      window.location.href = 'index.html';
    });

    const input   = document.getElementById('usernameInput');
    const saveBtn = document.getElementById('saveUsernameBtn');
    const msg     = document.getElementById('usernameMsg');
    const title   = document.querySelector('.cp-acct-title');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.style.color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#4ade80' : 'var(--cp-text-faint)';
    }

    saveBtn.addEventListener('click', async () => {
      const val = input.value.trim();
      if (!val) { showMsg('Enter a username first.', 'error'); return; }
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(val)) {
        showMsg('3–20 characters — letters, numbers and underscores only.', 'error');
        return;
      }
      saveBtn.disabled = true;
      showMsg('Saving…');
      const result = await DCAuth.updateUsername(val);
      saveBtn.disabled = false;
      if (result.error) {
        const taken = result.error.code === '23505' || /duplicate|unique/i.test(result.error.message || '');
        showMsg(taken ? 'That username is taken — try another.' : (result.error.message || 'Could not save. Try again.'), 'error');
        return;
      }
      showMsg('Saved!', 'success');
      if (title) title.textContent = val;
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
    });

    const avatarDrop     = document.getElementById('avatarDrop');
    const avatarFile     = document.getElementById('avatarFile');
    const avatarDropText = document.getElementById('avatarDropText');
    const avatarPreview  = document.getElementById('avatarPreview');
    const avatarUrlValue = document.getElementById('avatarUrlValue');
    const avatarMsg      = document.getElementById('avatarMsg');
    const fullNameInput = document.getElementById('fullNameInput');
    const dobInput       = document.getElementById('dobInput');
    const phoneInput     = document.getElementById('phoneInput');
    const backupEmailInput = document.getElementById('backupEmailInput');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const profileMsg = document.getElementById('profileMsg');

    function showProfileMsg(text, type) {
      profileMsg.textContent = text;
      profileMsg.style.color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#4ade80' : 'var(--cp-text-faint)';
    }

    async function uploadAvatar(file) {
      if (!file || !file.type.startsWith('image/')) {
        avatarMsg.textContent = 'Please choose an image file.';
        avatarMsg.style.color = '#ff6b6b';
        return;
      }
      const client = window.supabaseClient;
      if (!client) { avatarMsg.textContent = 'Store is not configured yet.'; avatarMsg.style.color = '#ff6b6b'; return; }
      avatarDropText.textContent = 'Uploading…';
      avatarMsg.textContent = '';
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${user.id}/avatar.${ext}`;
      const { error: upErr } = await client.storage.from('avatars').upload(path, file, { upsert: true, cacheControl: '3600' });
      if (upErr) {
        avatarDropText.textContent = 'Drag & drop an image, or click to choose one';
        avatarMsg.textContent = upErr.message || 'Upload failed. Try again.';
        avatarMsg.style.color = '#ff6b6b';
        return;
      }
      const { data: pub } = client.storage.from('avatars').getPublicUrl(path);
      const publicUrl = pub && pub.publicUrl ? `${pub.publicUrl}?t=${Date.now()}` : '';
      avatarUrlValue.value = publicUrl;
      avatarPreview.innerHTML = `<img src="${esc(publicUrl)}" alt="">`;
      avatarDropText.textContent = 'Drag & drop an image, or click to choose one';
      avatarMsg.textContent = 'Photo ready — click Save changes to keep it.';
      avatarMsg.style.color = '#4ade80';
    }

    avatarDrop.addEventListener('click', () => avatarFile.click());
    avatarFile.addEventListener('change', () => { if (avatarFile.files[0]) uploadAvatar(avatarFile.files[0]); });
    ['dragover','dragenter'].forEach(evt => avatarDrop.addEventListener(evt, (e) => {
      e.preventDefault(); avatarDrop.classList.add('is-dragover');
    }));
    ['dragleave','drop'].forEach(evt => avatarDrop.addEventListener(evt, (e) => {
      e.preventDefault(); avatarDrop.classList.remove('is-dragover');
    }));
    avatarDrop.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) uploadAvatar(file);
    });

    saveProfileBtn.addEventListener('click', async () => {
      const backupVal = backupEmailInput.value.trim();
      if (backupVal && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(backupVal)) {
        showProfileMsg('That backup email doesn\'t look right.', 'error');
        return;
      }
      saveProfileBtn.disabled = true;
      showProfileMsg('Saving…');
      const result = await DCAuth.updateProfile({
        full_name: fullNameInput.value.trim() || null,
        date_of_birth: dobInput.value || null,
        phone: phoneInput.value.trim() || null,
        backup_email: backupVal || null,
        avatar_url: avatarUrlValue.value.trim() || null
      });
      saveProfileBtn.disabled = false;
      if (result.error) {
        showProfileMsg(result.error.message || 'Could not save. Try again.', 'error');
        return;
      }
      showProfileMsg('Saved!', 'success');
      document.dispatchEvent(new CustomEvent('dc-auth-change'));
    });
  }

  load();
})();
</script>

</body>
</html>
