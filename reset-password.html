<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Crispy</title>
<meta name="description" content="Set a new password for your Crispy account.">
<link rel="icon" type="image/png" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/crispy-pizza.css">

<style>
.cp-auth-wrap{
  position:relative; z-index:1;
  max-width:420px;
  margin:0 auto;
  padding:clamp(2.5rem, 7vw, 4.5rem) clamp(1.2rem,4vw,2rem) 5rem;
}
.cp-auth-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(1.9rem, 4vw, 2.5rem);
  text-align:center;
  margin-bottom:1.8rem;
}
.cp-auth-field{ margin-bottom:1rem; }
.cp-auth-field label{ display:block; font-size:.8rem; color:var(--cp-text-faint); margin-bottom:.4rem; }
.cp-auth-field input{
  width:100%; padding:.8rem 1rem;
  border-radius:0;
  border:1px solid var(--cp-border);
  background:var(--cp-surface-2);
  color:var(--cp-text);
  font-size:.95rem; font-family:inherit;
}
.cp-auth-field input:focus{ outline:2px solid var(--cp-orange); outline-offset:1px; }
.cp-auth-msg{ min-height:1.3em; font-size:.85rem; text-align:center; margin-top:1rem; color:var(--cp-text-faint); }
</style>
</head>
<body class="cp-body">

<div class="cp-starfield" aria-hidden="true"></div>

<header class="cp-topbar">
  <a href="index.html" class="cp-logo">
    <span class="cp-logo__mark">🔥</span>
    Crispy <span class="dim">· by Darkness</span>
  </a>
  <div class="cp-topbar__right"></div>
</header>

<main>
  <div class="cp-auth-wrap">
    <h1 class="cp-auth-title">Set a new password</h1>

    <form id="resetForm">
      <div class="cp-auth-field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required autocomplete="new-password" minlength="6">
      </div>
      <div class="cp-auth-field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="cp-btn cp-btn--sm" id="submitBtn" style="margin-top:.4rem;">Save new password</button>
    </form>

    <p class="cp-auth-msg" id="resetMsg">Checking your reset link…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  const form = document.getElementById('resetForm');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('resetMsg');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.style.color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#4ade80' : 'var(--cp-text-faint)';
  }

  // The link from the reset email includes a recovery token in the URL;
  // supabase-js picks it up automatically and fires PASSWORD_RECOVERY.
  // Until that fires, there's no valid session yet to update a password on.
  let ready = false;
  const c = window.supabaseClient;
  if (c) {
    c.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        ready = true;
        showMsg('Enter a new password below.');
      }
    });
    // If they land here with an already-valid recovery session (e.g. page
    // refresh), getSession will still have it.
    c.auth.getSession().then(({ data }) => {
      if (data.session && !ready) { ready = true; showMsg('Enter a new password below.'); }
    });
  }
  setTimeout(() => {
    if (!ready) showMsg('This link looks invalid or expired — request a new one from the login page.', 'error');
  }, 4000);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;
    if (p1.length < 6) { showMsg('Password needs to be at least 6 characters.', 'error'); return; }
    if (p1 !== p2) { showMsg('Passwords don\'t match.', 'error'); return; }
    if (!ready) { showMsg('This link looks invalid or expired — request a new one from the login page.', 'error'); return; }

    submitBtn.disabled = true;
    showMsg('Saving…');
    const result = await DCAuth.updatePassword(p1);
    submitBtn.disabled = false;
    if (result.error) { showMsg(result.error.message, 'error'); return; }
    showMsg('Password updated — redirecting…', 'success');
    setTimeout(() => { window.location.href = 'account.html'; }, 1200);
  });
})();
</script>

</body>
</html>
