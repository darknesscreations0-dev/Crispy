<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Crispy</title>
<meta name="description" content="Complete your Crispy purchase.">
<link rel="icon" type="image/png" href="assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/crispy-pizza.css">

<style>
.cp-co-wrap{
  position:relative; z-index:1;
  max-width:640px; margin:0 auto;
  padding:clamp(2.5rem, 7vw, 4rem) clamp(1.2rem,4vw,2rem) 6rem;
}
.cp-co-eyebrow{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--cp-text-faint); margin-bottom:.5rem; }
.cp-co-title{ font-family:var(--font-display); font-size:clamp(1.7rem,3.6vw,2.4rem); font-weight:600; color:#f2ece4; margin:0 0 1.6rem; }

.cp-order-box{
  border:1px solid var(--cp-border); background:var(--cp-surface);
  padding:1.3rem 1.5rem; margin-bottom:1.6rem;
  display:flex; align-items:center; justify-content:space-between;
}
.cp-order-name{ font-weight:600; font-size:.98rem; color:#f2ece4; }
.cp-order-sub{ font-size:.78rem; color:var(--cp-text-faint); margin-top:.2rem; }
.cp-order-price{ font-size:1.2rem; font-weight:700; color:#f2ece4; }

.cp-section-heading{ font-size:.85rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--cp-text-faint); margin:0 0 .8rem; }

.cp-pay-option{
  border:1px solid var(--cp-border); background:var(--cp-surface);
  padding:1rem 1.2rem; margin-bottom:.8rem;
  display:flex; align-items:center; gap:1rem;
}
.cp-pay-option.disabled{ opacity:.45; }
.cp-pay-option.active{ border-color:#e8762c; cursor:pointer; }
.cp-pay-radio{
  width:18px; height:18px; border-radius:50%; border:1.5px solid var(--cp-border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.cp-pay-option.active .cp-pay-radio{ border-color:#e8762c; }
.cp-pay-option.active .cp-pay-radio::after{
  content:""; width:9px; height:9px; border-radius:50%; background:#e8762c;
}
.cp-pay-info{ flex:1; }
.cp-pay-name{ font-weight:600; font-size:.92rem; color:#f2ece4; }
.cp-pay-sub{ font-size:.76rem; color:var(--cp-text-faint); margin-top:.15rem; }
.cp-unavailable-tag{
  font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
  color:#e0685f; border:1px solid #e0685f; padding:2px 8px; flex-shrink:0;
}

.cp-continue-btn{
  display:block; width:100%; text-align:center; text-decoration:none;
  background:#e8762c; color:#1a0f06; font-weight:700; font-size:.92rem;
  padding:.9rem 1.4rem; margin-top:1.6rem; text-transform:uppercase; letter-spacing:.04em;
}
.cp-continue-btn:hover{ filter:brightness(1.08); }
</style>
</head>
<body>

<div class="cp-starfield" aria-hidden="true"></div>

<header class="cp-topbar">
  <a href="index.html" class="cp-logo cp-logo-clean">
    <img src="assets/icon.png" alt="Crispy" style="height:28px;width:auto;display:block;">
    <span style="color:#fff;font-weight:600;">Crispy</span>
  </a>
  <div class="cp-topbar__right"></div>
</header>

<main>
  <div class="cp-co-wrap">
    <div class="cp-co-eyebrow">Checkout</div>
    <h1 class="cp-co-title">Choose a payment method</h1>

    <div id="orderItems"></div>
    <div class="cp-order-box" id="orderTotalBox" style="display:none;">
      <div class="cp-order-name">Total</div>
      <div class="cp-order-price" id="orderTotal"></div>
    </div>

    <div class="cp-section-heading">Payment methods</div>

    <div class="cp-pay-option disabled">
      <div class="cp-pay-radio"></div>
      <div class="cp-pay-info">
        <div class="cp-pay-name">Card / UPI / Netbanking</div>
        <div class="cp-pay-sub">via Razorpay</div>
      </div>
      <div class="cp-unavailable-tag">Unavailable</div>
    </div>

    <div class="cp-pay-option disabled">
      <div class="cp-pay-radio"></div>
      <div class="cp-pay-info">
        <div class="cp-pay-name">International Cards</div>
        <div class="cp-pay-sub">via Lemon Squeezy</div>
      </div>
      <div class="cp-unavailable-tag">Unavailable</div>
    </div>

    <div class="cp-pay-option active">
      <div class="cp-pay-radio" id="directRadio"></div>
      <div class="cp-pay-info">
        <div class="cp-pay-name">Buy Direct via Seller</div>
        <div class="cp-pay-sub">Message us on WhatsApp to complete your purchase</div>
      </div>
    </div>

    <a href="buy-direct.html" class="cp-continue-btn" id="continueBtn">Continue</a>
  </div>
</main>

<script>
  // Same cart the rest of the site uses (see assets/js/store.js) —
  // an array of {id, name, price, image, qty} under this localStorage key.
  const CART_KEY = 'crispy_cart';
  const PROMO_KEY = 'crispy_promo';
  function getCart(){
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch(e){ return []; }
  }
  function getPromo(){
    try { return JSON.parse(localStorage.getItem(PROMO_KEY)) || null; }
    catch(e){ return null; }
  }
  function money(n){ return '$' + Number(n).toFixed(2); }

  const cart = getCart();
  const promo = getPromo();
  const itemsEl = document.getElementById('orderItems');
  const totalBox = document.getElementById('orderTotalBox');
  const totalEl = document.getElementById('orderTotal');

  if (!cart.length){
    itemsEl.innerHTML = `
      <div class="cp-order-box">
        <div>
          <div class="cp-order-name">Your cart is empty</div>
          <div class="cp-order-sub"><a href="catalog.html" style="color:#e8762c;">Browse products →</a></div>
        </div>
      </div>`;
  } else {
    itemsEl.innerHTML = cart.map(i => `
      <div class="cp-order-box">
        <div>
          <div class="cp-order-name">${i.name}</div>
          <div class="cp-order-sub">${i.qty > 1 ? i.qty + ' × ' + money(i.price) : '1 item'}</div>
        </div>
        <div class="cp-order-price">${money(i.price * (i.qty || 1))}</div>
      </div>`).join('') +
      (promo ? `
      <div class="cp-order-box">
        <div class="cp-order-name">Promo (${promo.code})</div>
        <div class="cp-order-price" style="font-size:.95rem;"></div>
      </div>` : '');

    const subtotal = cart.reduce((s, i) => s + Number(i.price) * (i.qty || 1), 0);
    const discount = promo
      ? (promo.discount_type === 'fixed' ? Math.min(Number(promo.discount_value), subtotal) : subtotal * (Number(promo.discount_value) / 100))
      : 0;
    const total = Math.max(0, subtotal - discount);
    if (promo){
      const promoPriceEl = itemsEl.querySelector('.cp-order-box:last-child .cp-order-price');
      if (promoPriceEl) promoPriceEl.textContent = '-' + money(discount);
    }
    totalEl.textContent = money(total);
    totalBox.style.display = 'flex';
  }

  // No URL params needed on buy-direct.html — it reads this same
  // localStorage cart (and promo) directly, since both pages share the same origin.
</script>

</body>
</html>
